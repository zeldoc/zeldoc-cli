[package]
name = "zeldoc"
version = "0.4.0"
edition = "2024"
description = "Command-line client for Zeldoc.ai"
repository = "https://github.com/zeldoc/zeldoc-cli"
license = "MIT"

[dependencies]
# Argument parsing
clap = { version = "4.6", features = ["derive", "env"] }

# HTTP client (rustls, so builds need no system OpenSSL; the same version
# axoupdater uses, so the binary carries one HTTP stack)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors: typed thiserror enums in the services, anyhow only at the command edge
thiserror = "2.0"
anyhow = "1.0"

# Money as exact decimals (prices arrive as decimal strings)
rust_decimal = "1.36"

# Dates in usage reports and the update check
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Utilities
dirs = "7.0"
rpassword = "7.4"

# `zeldoc update`: reinstalls with the release's own installer, using the
# receipt the installer left behind; tokio runs its async API
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
