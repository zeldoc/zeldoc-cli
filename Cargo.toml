[package]
name = "zeldoc"
version = "0.4.2"
edition = "2024"
description = "Command-line client for Zeldoc.ai"
repository = "https://github.com/zeldoc/zeldoc-cli"
license = "MIT"

[dependencies]
# Argument parsing
clap = { version = "4.6", features = ["derive", "env"] }

# HTTP client (rustls, so builds need no system OpenSSL; the same version
# axoupdater uses, so the binary carries one HTTP stack)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors: typed thiserror enums in the services, anyhow only at the command edge
thiserror = "2.0"
anyhow = "1.0"

# Money as exact decimals (prices arrive as decimal strings)
rust_decimal = "1.36"

# Dates in usage reports and the update check
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Utilities
dirs = "7.0"
rpassword = "7.4"

# `zeldoc update`: reinstalls with the release's own installer. axoupdater
# only reads the receipt the installer left behind; its own update asks
# GitHub's API, whose limit for networks without a GitHub login runs out
# (see `constants::releases`); it does not compile without `github_releases`.
# tempfile holds the downloaded installer.
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
tempfile = "3"

# Windows cannot delete a running executable; this deletes the replaced one
# once zeldoc exits
[target.'cfg(windows)'.dependencies]
self-replace = "1.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
