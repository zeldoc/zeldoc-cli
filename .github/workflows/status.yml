name: Status

# Doc-only pushes to main skip the checks. Pull requests always run: main
# requires these checks, and a required check that never starts blocks the
# PR forever.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: Format, Lint, Test, Typos
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test

      - name: Run typos
        uses: crate-ci/typos@v1.50.1

  test-other-platforms:
    name: Test (${{ matrix.os }})
    # Releases ship for macOS and Windows too; key storage, pin files and paths
    # differ there.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test
